project:
  type: book
  output-dir: docs

book:
  title: "Data Science Across Domains"
  subtitle: "From Methods and Models to Business Applications"
  author: "Rodrigo Kang"
  language: en
  cover-image: cover.png

  sidebar:
    collapse-level: 1
    tools:
      - icon: github
        href: https://github.com/rodrigokang/portfolio
      - icon: linkedin
        href: https://www.linkedin.com/in/rodrigojuankang/
      - icon: envelope
        href: "mailto:rodrigokang88@gmail.com"
      - icon: file-pdf
        text: PDF
        href: https://raw.githubusercontent.com/rodrigokang/portfolio/main/data-science-across-domains.pdf

  chapters:
    - index.qmd
    - preface.qmd
    - about.qmd
    - reading-guide.qmd

    - part: "Quantitative Finance"
      chapters:
        - 1-quantitative-finance/0-overview.qmd
        - 1-quantitative-finance/1-capm-and-fama-french-factor-model.qmd
        - 1-quantitative-finance/2-unsupervised-learning-for-asset-allocation.qmd
        - 1-quantitative-finance/3-option-pricing-with-path-integrals.qmd

    - part: "Retail Analytics"
      chapters:
        - 2-retail-analytics/0-overview.qmd
        - 2-retail-analytics/1-credit-card-fraud-detection-ml-benchmark.qmd
        - 2-retail-analytics/2-customer-value-and-retention.qmd
        - 2-retail-analytics/3-customer-sentiment-and-topic-analysis.qmd

    - part: "Biological Systems"
      chapters:
        - 3-biological-systems/0-overview.qmd
        - 3-biological-systems/1-microbial-population-dynamics.qmd
        - 3-biological-systems/2-medical-image-analysis.qmd

    - part: "Energy and Industrial Systems"
      chapters:
        - 4-energy-and-industrial-systems/0-overview.qmd
        - 4-energy-and-industrial-systems/1-permeability-prediction-in-porous-media.qmd
        - 4-energy-and-industrial-systems/2-optimal-hedging-industrial-gas-demand.qmd

    - part: "Climate and Environmental Systems"
      chapters:
        - 5-climate-and-environmental-systems/0-overview.qmd
        - 5-climate-and-environmental-systems/1-sediment-source-modeling.qmd
        - 5-climate-and-environmental-systems/2-climate-forecasting-time-series.qmd

    - part: "Writings & Essays"
      chapters:
        - 6-writings-and-essays/0-overview.qmd
        - 6-writings-and-essays/1-data-science-age-of-hype.qmd
        - 6-writings-and-essays/2-conformal-geometry-in-3-d.qmd

    - references.qmd

bibliography: references.bib
csl: ieee.csl

crossref:
  fig-prefix: Figure
  eq-prefix: Equation
  tbl-prefix: Table

format:
  html:
    theme: cosmo
    code-copy: true
    code-line-numbers: true
    mermaid:
      theme: default

  pdf:
    include-in-header: header.tex
    latex-engine: xelatex
    documentclass: book
    fontsize: 12pt
    toc: true
    toc-depth: 4
    number-sections: true
    mainfont: "Linux Libertine O"
    link-citations: true
    mermaid:
      theme: default