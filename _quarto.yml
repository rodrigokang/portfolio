project:
  type: book
  output-dir: docs

book:
  title: "Data Science Across Domains"
  subtitle: "From Methods and Models to Business Applications"
  author: "Rodrigo Kang"
  language: en
  cover-image: cover.png

  sidebar:
    collapse-level: 1
    tools:
      - icon: github
        href: https://github.com/rodrigokang/portfolio
      - icon: linkedin
        href: https://www.linkedin.com/in/rodrigojuankang/
      - icon: envelope
        href: "mailto:rodrigokang88@gmail.com"
      - icon: file-pdf
        text: PDF
        href: https://raw.githubusercontent.com/rodrigokang/portfolio/main/data-science-across-domains.pdf

  chapters:
    - index.qmd
    - preface.qmd
    - about.qmd
    - reading-guide.qmd

    - part: "Quantitative Finance"
      chapters:
        - 1-applied-data-science/0-overview.qmd
        - 1-applied-data-science/1-capm-and-fama-french-factor-model.qmd
        - 1-applied-data-science/2-unsupervised-learning-for-asset-allocation.qmd
        - 1-applied-data-science/3-option-pricing-with-path-integrals.qmd
        - 1-applied-data-science/4-credit-card-fraud-detection-ml-benchmark.qmd
        - 1-applied-data-science/5-customer-value-and-retention.qmd
        - 1-applied-data-science/6-customer-feedback-nlp.qmd
        - 1-applied-data-science/7-sediment-source-modeling.qmd
        - 1-applied-data-science/8-skin-lesion-triage.qmd
        - 1-applied-data-science/9-drought-risk-climate-time-series.qmd

    - part: "Data Science Beyond the Classical Scope"
      chapters:
        - 2-data-science-beyond-the-classical-scope/0-overview.qmd
        - 2-data-science-beyond-the-classical-scope/1-quantum-control-theory.qmd

    - part: "Writings & Essays"
      chapters:
        - 3-writings-and-essays/0-overview.qmd
        - 3-writings-and-essays/1-data-science-age-of-hype.qmd
        - 3-writings-and-essays/2-conformal-geometry-in-3-d.qmd

    - references.qmd

bibliography: references.bib
csl: ieee.csl

crossref:
  fig-prefix: Figure
  eq-prefix: Equation
  tbl-prefix: Table

format:
  html:
    theme: cosmo
    code-copy: true
    code-line-numbers: true
    mermaid:
      theme: default

